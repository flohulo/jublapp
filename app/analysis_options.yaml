# Statische Analyse für die Flutter-App (`flutter analyze`).
# Weitere Regeln: https://dart.dev/tools/linter-rules

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - windows/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Einheitliche Anführungszeichen im ganzen Projekt.
    prefer_single_quotes: true
    # Nicht abgewartete Futures fallen sonst nur im Fehlerfall auf.
    unawaited_futures: true
