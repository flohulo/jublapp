name: jublapp
description: "JUBL(A)PP – Reporting-Tool für Jubla Wald/ZH"
publish_to: 'none'

# Wird von update-version.js aus package.json übernommen.
version: 0.11.1 # x-release-please-version

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.2
  http: ^1.5.0
  http_parser: ^4.1.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/locales/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#a62429"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
