<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JUBL(A)PP - Leiter erfassen</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/action.css" />
  </head>

  <body>
    <form class="mobile-container" id="leiter-form">
      <div class="header">
        <a href="uebersicht.html" aria-label="Abbrechen">
          <i class="fa-solid fa-xmark header-icon"></i>
        </a>
        <div class="header-title">
          JUBL(A)PP<br />
          Leiter erfassen
        </div>
        <button
          type="submit"
          id="submit-btn"
          aria-label="Leiter speichern"
          style="background: none; border: none; color: white; cursor: pointer"
        >
          <i class="fa-solid fa-check header-icon"></i>
        </button>
      </div>

      <div class="form-container">
        <div class="form-group">
          <label class="form-label" for="vorname">Vorname *</label>
          <input
            class="input-field"
            id="vorname"
            name="vorname"
            autocomplete="given-name"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="nachname">Nachname *</label>
          <input
            class="input-field"
            id="nachname"
            name="nachname"
            autocomplete="family-name"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">E-Mail</label>
          <input
            class="input-field"
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="name@beispiel.ch"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="telefon">Telefon</label>
          <input
            class="input-field"
            id="telefon"
            name="telefon"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="079 123 45 67"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="funktion">Funktion *</label>
          <div class="select-wrapper">
            <select id="funktion" name="funktion" required>
              <option value="" selected disabled>Funktion auswählen</option>
              <option>Hauptleitung</option>
              <option>Gruppenleitung</option>
              <option>Hilfsleitung</option>
              <option>Scharleitung</option>
              <option>Coach</option>
              <option>Sonstige</option>
            </select>
            <i class="fa-solid fa-chevron-down select-arrow"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="stufe">Stufe / Gruppe</label>
          <input
            class="input-field"
            id="stufe"
            name="stufe"
            placeholder="z. B. Blauring oder Schar"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="bemerkungen">Bemerkungen</label>
          <textarea
            class="input-field"
            id="bemerkungen"
            name="bemerkungen"
            rows="4"
            placeholder="Optionale Hinweise"
          ></textarea>
        </div>

        <div
          id="status-message"
          aria-live="polite"
          style="text-align: center"
        ></div>
      </div>
    </form>

    <script>
      const form = document.getElementById("leiter-form");
      const submitBtn = document.getElementById("submit-btn");
      const statusMessage = document.getElementById("status-message");

      function setStatus(message, isError = false) {
        statusMessage.textContent = message;
        statusMessage.style.color = isError ? "#b00020" : "#333";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;

        submitBtn.disabled = true;
        setStatus("Speichere Leiter:in …");

        const payload = {
          ...Object.fromEntries(new FormData(form).entries()),
          timestamp: new Date().toISOString(),
        };

        try {
          const response = await fetch("/api/leiter", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (response.status === 401 || response.status === 403) {
            window.location.href = "../index.html";
            return;
          }

          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Unbekannter Fehler");

          setStatus("Leiter:in erfolgreich gespeichert.");
          setTimeout(() => {
            window.location.href = "erfolg.html";
          }, 800);
        } catch (error) {
          console.error(error);
          setStatus(`Fehler beim Speichern: ${error.message}`, true);
          submitBtn.disabled = false;
        }
      });
    </script>
    <script src="/assets/app.js"></script>
  </body>
</html>
