name: Flutter Tests und Builds (APK, EXE, Web)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "app/**"
      - "locales/**"
      - ".github/workflows/app-build.yml"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.1"
  APP_NAME: JUBL(A)PP

jobs:
  # Analyse + Tests (inkl. Kontrolle der Mehrsprachigkeit: alle Sprachen haben
  # dieselben Schlüssel/Platzhalter und die App-Assets spiegeln locales/).
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version aus package.json übernehmen
        run: node update-version.js

      - name: APK bauen
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../JUBLAPP.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: JUBLAPP.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version aus package.json übernehmen
        run: node update-version.js

      - name: Windows-App bauen
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: ZIP erstellen (EXE + benötigte DLLs/Daten)
        shell: pwsh
        run: |
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "JUBLAPP-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: JUBLAPP-windows.zip

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Web-App bauen (wie beim Netlify-Deploy)
        run: bash scripts/build-web.sh

      - name: ZIP erstellen
        run: cd dist && zip -r ../JUBLAPP-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: JUBLAPP-web.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-exe/*.zip
            artifacts/web/*.zip
