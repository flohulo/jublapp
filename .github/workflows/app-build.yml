name: App bauen (APK, EXE, Web)

# Baut alle Plattformen. Wird vom Release-Workflow aufgerufen, kann von Hand
# gestartet werden und läuft bei Änderungen an der App in Pull Requests.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "app/**"
      - "locales/**"
      - "scripts/**"
      - "update-version.js"
      - "package.json"
      - ".github/workflows/app-build.yml"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.1"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version aus package.json übernehmen
        run: node update-version.js

      - name: APK bauen
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../JUBLAPP.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: JUBLAPP.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version aus package.json übernehmen
        run: node update-version.js

      - name: Windows-App bauen
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: ZIP erstellen (EXE + benötigte DLLs/Daten)
        shell: pwsh
        run: Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "JUBLAPP-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: JUBLAPP-windows.zip

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Web-App bauen (wie beim Netlify-Deploy)
        run: bash scripts/build-web.sh

      - name: ZIP erstellen
        run: cd dist && zip -r ../JUBLAPP-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: JUBLAPP-web.zip
