name: App bauen (APK, EXE, Web)

# Baut alle Plattformen. Wird vom Release-Workflow aufgerufen, kann von Hand
# gestartet werden und läuft bei Änderungen an der App in Pull Requests.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "update-version.js"
      - "package.json"
      - ".github/workflows/app-build.yml"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version aus package.json übernehmen
        run: node update-version.js

      # Fester Release-Schlüssel aus den GitHub-Secrets. Ohne Secrets (z. B. PRs von
      # Forks) wird mit dem Debug-Schlüssel gebaut; diese APK ist nur zum Testen.
      - name: Release-Keystore wiederherstellen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # Leerzeichen und Zeilenenden (z. B. \r von Windows) entfernen, sonst
            # lehnt base64 -d den Wert mit "invalid input" ab.
            if ! echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/android/app/release.keystore; then
              echo "::error::ANDROID_KEYSTORE_BASE64 ist kein gültiges Base64. Secret neu aus der Datei release.keystore erzeugen (siehe app/README.md)."
              exit 1
            fi
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 fehlt, APK wird mit dem Debug-Schlüssel signiert."
          fi

      - name: APK bauen
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../JUBLAPP.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: JUBLAPP.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version aus package.json übernehmen
        run: node update-version.js

      - name: Windows-App bauen
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: ZIP erstellen (EXE + benötigte DLLs/Daten)
        shell: pwsh
        run: Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "JUBLAPP-windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: JUBLAPP-windows.zip

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Web-App bauen (wie beim Netlify-Deploy)
        run: bash scripts/build-web.sh

      - name: ZIP erstellen
        run: cd dist && zip -r ../JUBLAPP-web.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: JUBLAPP-web.zip
