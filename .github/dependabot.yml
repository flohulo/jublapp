version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      pub-minor-patch:
        update-types:
          - minor
          - patch
