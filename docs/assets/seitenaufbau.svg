<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="title description">
  <title id="title">Schematischer Aufbau einer JUBL(A)PP-Formularseite</title>
  <desc id="description">Eine Smartphone-Seite mit Kopfzeile, Zurück-Schaltfläche, Seitentitel, Absenden-Schaltfläche, Formularfeldern, optionalem Inhalt und Rückmeldung.</desc>
  <rect width="720" height="980" rx="32" fill="#f6f6f6"/>
  <text x="360" y="64" text-anchor="middle" fill="#242424" font-family="Arial, sans-serif" font-size="28" font-weight="700">So ist eine Formularseite aufgebaut</text>

  <rect x="180" y="105" width="360" height="790" rx="36" fill="#fff" stroke="#aaa" stroke-width="4"/>
  <rect x="199" y="125" width="322" height="82" rx="12" fill="#a62429"/>
  <circle cx="226" cy="166" r="19" fill="#fff" opacity=".2"/>
  <text x="226" y="173" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">X</text>
  <text x="356" y="158" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">JUBL(A)PP</text>
  <text x="356" y="181" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17">Seitentitel</text>
  <circle cx="493" cy="166" r="19" fill="#fff" opacity=".2"/>
  <text x="493" y="173" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">✓</text>

  <rect x="222" y="230" width="276" height="60" rx="10" fill="#fff" stroke="#c7c7c7" stroke-width="2"/>
  <text x="238" y="254" fill="#444" font-family="Arial, sans-serif" font-size="14" font-weight="700">Feldbeschriftung</text>
  <text x="238" y="276" fill="#888" font-family="Arial, sans-serif" font-size="14">Eingabe oder Auswahl</text>
  <rect x="222" y="310" width="276" height="60" rx="10" fill="#fff" stroke="#c7c7c7" stroke-width="2"/>
  <text x="238" y="334" fill="#444" font-family="Arial, sans-serif" font-size="14" font-weight="700">Weiteres Feld</text>
  <text x="238" y="356" fill="#888" font-family="Arial, sans-serif" font-size="14">Pflichtfelder ausfüllen</text>
  <rect x="222" y="390" width="276" height="126" rx="10" fill="#fff" stroke="#c7c7c7" stroke-width="2"/>
  <text x="238" y="417" fill="#444" font-family="Arial, sans-serif" font-size="14" font-weight="700">Beschreibung</text>
  <path d="M238 440h244M238 462h244M238 484h165" stroke="#ddd" stroke-width="3"/>
  <rect x="222" y="536" width="276" height="82" rx="10" fill="#fff" stroke="#c7c7c7" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="360" y="570" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="14" font-weight="700">Optionaler Bereich</text>
  <text x="360" y="593" text-anchor="middle" fill="#777" font-family="Arial, sans-serif" font-size="13">z. B. Fotos oder Zusatzangaben</text>
  <rect x="222" y="640" width="276" height="62" rx="10" fill="#f8f1f1" stroke="#d8b5b5" stroke-width="2"/>
  <text x="360" y="666" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="14" font-weight="700">Status / Rückmeldung</text>
  <text x="360" y="688" text-anchor="middle" fill="#777" font-family="Arial, sans-serif" font-size="13">Erfolg oder verständlicher Fehlerhinweis</text>

  <path d="M180 165H112" stroke="#a62429" stroke-width="3"/>
  <circle cx="104" cy="165" r="6" fill="#a62429"/>
  <text x="95" y="143" text-anchor="end" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="700">Zurück</text>
  <text x="95" y="187" text-anchor="end" fill="#555" font-family="Arial, sans-serif" font-size="14">zur Bereichsseite</text>

  <path d="M540 165H608" stroke="#a62429" stroke-width="3"/>
  <circle cx="616" cy="165" r="6" fill="#a62429"/>
  <text x="625" y="143" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="700">Absenden</text>
  <text x="625" y="187" fill="#555" font-family="Arial, sans-serif" font-size="14">Formular prüfen</text>

  <path d="M222 332H112" stroke="#777" stroke-width="2"/>
  <circle cx="104" cy="332" r="5" fill="#777"/>
  <text x="95" y="310" text-anchor="end" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="700">Formular</text>
  <text x="95" y="354" text-anchor="end" fill="#555" font-family="Arial, sans-serif" font-size="14">Felder ausfüllen</text>

  <path d="M498 577H608" stroke="#777" stroke-width="2"/>
  <circle cx="616" cy="577" r="5" fill="#777"/>
  <text x="625" y="555" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="700">Optional</text>
  <text x="625" y="599" fill="#555" font-family="Arial, sans-serif" font-size="14">nur falls nötig</text>

  <text x="360" y="940" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="15">Schematische Darstellung – die Inhalte unterscheiden sich je nach Funktion.</text>
</svg>
